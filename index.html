:root{
  --bg:#0A0A0A; --oil:#202020; --gravel:#4D4D4D; --text:#EEEEEE; --mute:#9A9A9A; --soft:#BDBDBD;
  --coral:#F54343; --squash:#F1AE0A; --cadet:#80A2B4;
  --mono:"Lilex",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:#050505}
body{margin:0;background:#050505;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
a{color:inherit}
input,select,textarea{font:inherit;color:#fff;border-radius:2px}
input::placeholder,textarea::placeholder{color:#6E6E6E}
select option{background:#202020;color:#fff}
#app{width:100%;max-width:480px;margin:0 auto;background:var(--bg);min-height:100dvh;position:relative}
@media(min-width:520px){#app{border-left:1px solid var(--oil);border-right:1px solid var(--oil)}}
.screen{min-height:100dvh;display:flex;flex-direction:column;padding:24px;background:var(--bg);animation:fade .22s ease-out}
.screen.fixed{height:100dvh;min-height:0;padding:0;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}
.bar{padding:16px 24px 24px;border-top:1px solid var(--oil);display:grid;gap:8px;background:var(--bg)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo{height:14px;width:auto;align-self:flex-start;display:block;mix-blend-mode:lighten}
.row{display:flex;justify-content:space-between;align-items:center}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--squash)}
.step{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--mute)}
.foot{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mute)}
.h1{font-weight:800;letter-spacing:-.035em;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0 20px;border:1px solid var(--text);border-radius:0;background:var(--text);color:var(--bg);font:600 14px var(--mono);letter-spacing:.06em;white-space:nowrap;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--mute)}
.btn.dark{background:var(--bg);color:var(--text);border-color:var(--bg)}
.btn.rev{flex-direction:row-reverse}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5}
.txt{background:none;color:var(--text);font:400 12px var(--mono);letter-spacing:.08em;min-height:44px;display:flex;align-items:center}
.prog{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:28px}
.prog i{height:3px;background:var(--gravel)}
.prog i.on{background:var(--text)}
.aw{max-height:240px;margin-bottom:10px;overflow:hidden;transition:max-height 280ms cubic-bezier(.4,0,.2,1),opacity 200ms,margin 280ms}
.aw.gone{max-height:0;opacity:0;margin-bottom:0}
.ac{width:100%;min-height:56px;background:var(--oil);border:1px solid var(--oil);border-radius:2px;padding:14px 16px;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;transition:border-color 120ms}
.ac:active{background:#2A2A2A;border-color:var(--gravel)}
.ac .num{width:28px;height:22px;border:1px solid var(--gravel);color:var(--mute);font:400 11px var(--mono);display:flex;align-items:center;justify-content:center;margin-top:1px}
.ac.sel{border-color:var(--cadet)}
.ac.sel .num{border-color:var(--cadet);background:var(--cadet);color:var(--bg)}
.at{font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.2;color:var(--text)}
.atx{font-size:16px;line-height:1.4;color:var(--text)}
.atx.mute{color:var(--mute)}
.sheetwrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:5}
.sheet{width:100%;max-width:480px;background:var(--text);color:var(--bg);padding:24px;display:flex;flex-direction:column;gap:14px;transform:translateY(105%);transition:transform 320ms cubic-bezier(.4,0,.2,1);pointer-events:auto}
.sheet.in{transform:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.inp{height:48px;width:100%;background:var(--oil);border:1px solid var(--gravel);padding:0 14px;font:400 17px var(--sans);outline:none}
.inp:focus{border-color:var(--cadet)}
.inp.bad{border-color:var(--coral)}
textarea.inp{height:auto;padding:12px 14px;line-height:1.4;resize:none}
.selwrap{position:relative}
.selwrap select{appearance:none;-webkit-appearance:none;padding-right:36px}
.selwrap b{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:400 14px var(--mono);color:var(--mute);pointer-events:none}
.chk{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;min-height:48px;padding-top:4px}
.chk .box{width:24px;height:24px;border:1px solid var(--mute);display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:15px;font-weight:700}
.chk.on .box{border-color:var(--cadet);background:var(--cadet)}
.err{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--coral);margin-top:12px;display:none}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:7px 9px;white-space:nowrap;border:1px solid var(--gravel);color:var(--text);border-radius:2px}
.pill.top{border-color:var(--coral);background:var(--coral);color:var(--bg)}
.dh{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--squash)}
.jrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:72px;border-top:1px solid var(--gravel);padding:12px 0;text-decoration:none}
.tile{background:var(--oil);height:104px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;border-radius:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px}
.tab .av{width:52px;height:52px;border-radius:50%;background:var(--oil);overflow:hidden;border:2px solid transparent}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--oil);color:var(--text);padding:12px 16px;font:400 12px var(--mono);letter-spacing:.04em;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--gravel);z-index:9;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>
<canvas id="shareCanvas" width="1080" height="1080" style="display:none"></canvas>

<script>
/* ============================================================
   CHARACTER ART — parametric flat SVG figures (from the design bundle)
   ============================================================ */
/* Sand Adventurer character system — parametric flat SVG figures.
   window.AdvArt.scene(name, opts) -> {vb:[x,y,w,h], svg:string, bust:[x,y,w,h]}
   window.AdvFigure — React component: <AdvFigure scene="gonzo" dir="A" crop="full|bust" rough /> */
(function () {
  const K = { bg: '#0A0A0A', oil: '#202020', gravel: '#4D4D4D', white: '#FFFFFF', coral: '#F54343', squash: '#F1AE0A', cadet: '#80A2B4', mute: '#9A9A9A' };
  const R = (a) => (a * Math.PI) / 180;
  const dv = (a, l) => ({ x: Math.sin(R(a)) * l, y: Math.cos(R(a)) * l });
  const mv = (p, u, k) => ({ x: p.x + u.x * k, y: p.y + u.y * k });
  const f = (n) => Math.round(n * 10) / 10;
  const SKIN = ['#C4C4C4', '#8E8E8E', '#A8A8A8', '#707070', '#B6B6B6'];

  function limb(p0, a1, l1, a2, l2, w, col, ol) {
    const j1 = mv(p0, dv(a1, 1), l1), j2 = mv(j1, dv(a2, 1), l2);
    const d = `M${f(p0.x)} ${f(p0.y)}L${f(j1.x)} ${f(j1.y)}L${f(j2.x)} ${f(j2.y)}`;
    return {
      svg: `<path d="${d}" fill="none" stroke="${ol}" stroke-width="${w + 5}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`,
      j1, j2,
    };
  }

  function eyesA(expr, cx, cy, sp, col) {
    const e = [cx - sp, cx + sp];
    if (expr === 'focused') return e.map((x) => `<rect x="${f(x - 4.5)}" y="${f(cy - 1.8)}" width="9" height="3.6" rx="1.8" fill="${col}"/>`).join('');
    if (expr === 'amused') return e.map((x) => `<path d="M${f(x - 4.5)} ${f(cy + 2.5)}Q${f(x)} ${f(cy - 5)} ${f(x + 4.5)} ${f(cy + 2.5)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round"/>`).join('');
    if (expr === 'thought') return e.map((x, i) => `<rect x="${f(x + 2)}" y="${f(cy - 8 + i * 1.5)}" width="5" height="${i ? 8 : 9}" rx="2.5" fill="${col}"/>`).join('');
    if (expr === 'up') return e.map((x) => `<rect x="${f(x + 1)}" y="${f(cy - 9)}" width="5" height="8" rx="2.5" fill="${col}"/>`).join('');
    return e.map((x) => `<rect x="${f(x - 2.5)}" y="${f(cy - 5)}" width="5" height="10" rx="2.5" fill="${col}"/>`).join('');
  }

  function faceB(expr, cx, cy, at) {
    const sp = 7 * (1 - at * 0.25), ex = [cx - sp, cx + sp], ink = K.bg;
    let s = '';
    if (expr === 'focused') s += ex.map((x) => `<rect x="${f(x - 3.2)}" y="${f(cy - 3.5)}" width="6.4" height="2.6" rx="1.3" fill="${ink}"/>`).join('');
    else if (expr === 'amused') s += ex.map((x) => `<path d="M${f(x - 3.2)} ${f(cy - 1)}Q${f(x)} ${f(cy - 6)} ${f(x + 3.2)} ${f(cy - 1)}" fill="none" stroke="${ink}" stroke-width="2.4" stroke-linecap="round"/>`).join('');
    else if (expr === 'thought' || expr === 'up') s += ex.map((x) => `<circle cx="${f(x + 2)}" cy="${f(cy - 5.5)}" r="2.4" fill="${ink}"/>`).join('');
    else s += ex.map((x) => `<circle cx="${f(x)}" cy="${f(cy - 2.5)}" r="2.4" fill="${ink}"/>`).join('');
    if (expr === 'amused') s += `<path d="M${f(cx - 5)} ${f(cy + 5)}Q${f(cx)} ${f(cy + 10)} ${f(cx + 5)} ${f(cy + 5)}" fill="none" stroke="${ink}" stroke-width="2.2" stroke-linecap="round"/>`;
    else if (expr === 'thought') s += `<circle cx="${f(cx + 3)}" cy="${f(cy + 7)}" r="1.8" fill="${ink}"/>`;
    else if (expr === 'focused') s += `<rect x="${f(cx - 3.5)}" y="${f(cy + 6)}" width="7" height="2.2" rx="1.1" fill="${ink}"/>`;
    return s;
  }

  /* o: {x,y,s,flip,turn,lean,tilt,legs:{l,r},arms:{l,r},expr,dir,grey,build,skin,accent,ol,under(J),over(J)} */
  function figure(o) {
    const t = o.turn || 0, at = Math.abs(t), L = o.lean || 0, build = o.build || 1;
    const dir = o.dir || 'A';
    const col = o.grey ? { b: '#6E6E6E', sh: '#515151', v: K.oil, e: '#B5B5B5' } : { b: '#EDEDED', sh: '#AFAFAF', v: K.oil, e: K.white };
    const ol = o.ol || K.bg;
    const W = 40 * build * (1 - at * 0.28);
    const legs = o.legs || { l: [-3, -3], r: [3, 3] };
    const arms = o.arms || { l: [-10, -5], r: [10, 5] };
    const T = 31, S = 29, LW = 15, AW = 13;
    const drop = (a) => T * Math.cos(R(a[0])) + S * Math.cos(R(a[1]));
    const hip = { x: 0, y: -(Math.max(drop(legs.l), drop(legs.r)) + LW / 2 + 0.5) };
    const up = dv(180 - L, 1), perp = { x: Math.cos(R(L)), y: Math.sin(R(L)) };
    const tA = mv(hip, up, 6), tB = mv(hip, up, 36), neck = mv(hip, up, 46), shC = mv(hip, up, 33);
    const so = (W / 2 - 5) * (1 - at * 0.6);
    const sh = { l: mv(shC, perp, -so), r: mv(shC, perp, so) };
    const ho = 9 * build * (1 - at * 0.6);
    const hp = { l: mv(hip, perp, -ho), r: mv(hip, perp, ho) };
    const head = mv(neck, dv(180 - (L + (o.tilt || 0) * 0.4), 1), 27);
    const far = t > 0.15 ? 'r' : t < -0.15 ? 'l' : null;
    const J = { hip, neck, head, sh, hp, up, perp, W, L, t, hand: {}, elbow: {}, knee: {}, foot: {}, ol };
    const L_ = {}, A_ = {};
    ['l', 'r'].forEach((k) => {
      const isFar = k === far;
      const lg = limb(hp[k], legs[k][0], T, legs[k][1], S, LW, isFar ? col.sh : col.b, ol);
      L_[k] = lg.svg; J.knee[k] = lg.j1; J.foot[k] = lg.j2;
      const am = limb(sh[k], arms[k][0], 23, arms[k][1], 21, AW, isFar ? col.sh : col.b, ol);
      A_[k] = am.svg; J.elbow[k] = am.j1; J.hand[k] = am.j2;
    });
    let s = '';
    if (!o.noShadow) s += `<ellipse cx="0" cy="1" rx="${f(34 + at * 6)}" ry="5" fill="#FFFFFF" fill-opacity="0.1"/>`;
    if (o.under) s += o.under(J, K);
    const near = far ? (far === 'l' ? 'r' : 'l') : null;
    if (far) s += A_[far];
    s += L_.l + L_.r;
    const tp = `M${f(tA.x)} ${f(tA.y)}L${f(tB.x)} ${f(tB.y)}`;
    s += `<path d="${tp}" stroke="${ol}" stroke-width="${f(W + 5)}" stroke-linecap="round"/><path d="${tp}" stroke="${col.b}" stroke-width="${f(W)}" stroke-linecap="round"/>`;
    if (o.mid) s += o.mid(J, K);
    if (!o.grey && o.accent) {
      const b = mv(mv(shC, up, -9), perp, t * 7 * (o.flip ? 1 : 1));
      s += `<rect x="${f(b.x - 4.5)}" y="${f(b.y - 4.5)}" width="9" height="9" rx="1.5" transform="rotate(${f(L)} ${f(b.x)} ${f(b.y)})" fill="${o.accent}"/>`;
    }
    s += far ? A_[near] : A_.l + A_.r;
    // head
    const tilt = L + (o.tilt || 0);
    s += `<g transform="translate(${f(head.x)} ${f(head.y)}) rotate(${f(tilt)})">`;
    if (dir === 'A') {
      s += `<path d="M0 -30L0 -40" stroke="${ol}" stroke-width="6" stroke-linecap="round"/><path d="M0 -30L0 -40" stroke="${col.b}" stroke-width="2.6" stroke-linecap="round"/><circle cx="0" cy="-43" r="4.2" fill="${col.b}" stroke="${ol}" stroke-width="2.5"/>`;
      s += `<circle r="31" fill="${col.b}" stroke="${ol}" stroke-width="3"/>`;
      const vw = 46 - at * 12, vx = t * 13, vy = 2 + (o.expr === 'up' ? -5 : 0);
      s += `<rect x="${f(vx - vw / 2)}" y="${f(vy - 14)}" width="${f(vw)}" height="29" rx="13" fill="${col.v}"/>`;
      s += eyesA(o.expr, vx + t * 2, vy + 1, 9 * (1 - at * 0.35), col.e);
    } else {
      s += `<circle r="31" fill="${col.b}" stroke="${ol}" stroke-width="3"/>`;
      const fx = t * 12, fy = 5 + (o.expr === 'up' ? -3 : 0);
      s += `<rect x="${f(-27 + t * 5)}" y="-20" width="${f(54 - at * 8)}" height="6" rx="3" fill="${col.sh}"/>`;
      s += `<rect x="${f(-5 + t * 12)}" y="-30" width="10" height="8" rx="2" fill="${o.grey ? '#3A3A3A' : K.gravel}"/>`;
      s += `<circle cx="${f(fx)}" cy="${f(fy)}" r="${f(19.5 - at * 2)}" fill="${o.grey ? '#4A4A4A' : o.skin || SKIN[0]}"/>`;
      if (!o.grey) s += faceB(o.expr, fx + t * 2, fy, at);
    }
    s += `</g>`;
    if (o.over) s += o.over(J, K);
    const sc = o.s || 1;
    const g = `<g transform="translate(${f(o.x || 0)} ${f(o.y || 0)}) scale(${o.flip ? -sc : sc} ${sc})">${s}</g>`;
    const hx = (o.x || 0) + (o.flip ? -1 : 1) * head.x * sc, hy = (o.y || 0) + head.y * sc;
    return { svg: g, head: { x: hx, y: hy }, s: sc };
  }

  /* ---------- props ---------- */
  const pack = (J, c, fill, tall) => {
    const b = mv(mv(J.hip, J.up, 30), J.perp, -(J.W / 2 + 9));
    const h = tall ? 50 : 38;
    let s = `<rect x="${f(b.x - 12)}" y="${f(b.y - h / 2)}" width="24" height="${h}" rx="5" transform="rotate(${f(J.L)} ${f(b.x)} ${f(b.y)})" fill="${fill}" stroke="${J.ol}" stroke-width="3"/>`;
    if (tall) s += `<rect x="${f(b.x - 14)}" y="${f(b.y - h / 2 - 10)}" width="28" height="12" rx="6" transform="rotate(${f(J.L)} ${f(b.x)} ${f(b.y)})" fill="#6E6E6E" stroke="${J.ol}" stroke-width="3"/>`;
    return s;
  };
  const strap = (J) => {
    const a = mv(mv(J.hip, J.up, 40), J.perp, -J.W / 2 + 4), b = mv(mv(J.hip, J.up, 12), J.perp, J.W / 2 - 10);
    return `<path d="M${f(a.x)} ${f(a.y)}L${f(b.x)} ${f(b.y)}" stroke="${K.oil}" stroke-width="4" stroke-linecap="round"/>`;
  };
  const rect = (x, y, w, h, rot, fill, extra) => `<rect x="${f(x - w / 2)}" y="${f(y - h / 2)}" width="${w}" height="${h}" rx="1.5" transform="rotate(${rot} ${f(x)} ${f(y)})" fill="${fill}" ${extra || ''}/>`;

  /* ---------- scenes ---------- */
  const S = {};
  const A = (dir, i) => ({ dir, skin: SKIN[i % 5], build: dir === 'B' ? [1, 1.08, 0.95, 1.05, 0.92][i % 5] : 1 });

  S.gonzo = (o) => {
    let s = '';
    [[-70, -118, 22], [-62, -92, 30], [-74, -66, 18]].forEach(([x, y, w]) => (s += `<path d="M${o.x + x} ${o.y + y}h${w}" stroke="${K.gravel}" stroke-width="3" stroke-linecap="round"/>`));
    const F = figure({ ...A(o.dir, 0), x: o.x, y: o.y, s: o.s, turn: 0.6, lean: 10, tilt: -4, expr: 'focused', accent: K.coral,
      legs: { l: [38, 8], r: [-34, -70] }, arms: { r: [-38, -20], l: [30, 95] },
      under: (J) => pack(J, K, '#3A3A3A') + `<path d="${(() => { const b = mv(mv(J.hip, J.up, 44), J.perp, -(J.W / 2 + 9)); return `M${f(b.x - 8)} ${f(b.y)}h9`; })()}" stroke="${K.gravel}" stroke-width="2.5" stroke-linecap="round"/>`,
      mid: strap,
      over: (J) => rect(J.hand.l.x + 9, J.hand.l.y - 3, 20, 12, -12, K.coral) + `<path d="M${f(J.hand.l.x + 2)} ${f(J.hand.l.y - 3)}h11" stroke="${K.bg}" stroke-width="1.6" transform="rotate(-12 ${f(J.hand.l.x + 9)} ${f(J.hand.l.y - 3)})"/>` });
    return { svg: s + F.svg, head: F.head, s: o.s };
  };

  S.mechanic = (o) => {
    const px = o.x + 62 * o.s, py = o.y;
    let s = `<g transform="translate(${px} ${py}) scale(${o.s})">`;
    s += `<rect x="0" y="-104" width="58" height="104" rx="2" fill="${K.oil}" stroke="${K.gravel}" stroke-width="2"/>`;
    s += `<path d="M58 -104L84 -96V-8L58 0Z" fill="#161616" stroke="${K.gravel}" stroke-width="2" stroke-linejoin="round"/>`;
    for (let i = 0; i < 4; i++) s += `<rect x="10" y="${-92 + i * 14}" width="38" height="6" rx="1" fill="${i === 2 ? '#3A3A3A' : '#2E2E2E'}"/>`;
    s += `<circle cx="16" cy="-24" r="3" fill="${K.mute}"/><circle cx="28" cy="-24" r="3" fill="${K.gravel}"/>`;
    s += `</g>`;
    s += `<g transform="translate(${o.x - 48 * o.s} ${o.y - 8 * o.s}) scale(${o.s})"><circle r="10" fill="none" stroke="${K.gravel}" stroke-width="4"/><circle r="5" fill="none" stroke="${K.gravel}" stroke-width="4"/><path d="M10 0h16" stroke="${K.gravel}" stroke-width="4" stroke-linecap="round"/></g>`;
    const F = figure({ ...A(o.dir, 1), x: o.x, y: o.y, s: o.s, turn: 0.6, lean: 28, tilt: 18, expr: 'focused', accent: K.squash,
      legs: { l: [82, -4], r: [10, -86] }, arms: { r: [55, 40], l: [78, 110] },
      over: (J) => { const h = J.hand.l; return `<path d="M${f(h.x)} ${f(h.y)}l14 -6" stroke="${K.squash}" stroke-width="5" stroke-linecap="round"/><circle cx="${f(h.x + 17)}" cy="${f(h.y - 7.5)}" r="4.5" fill="none" stroke="${K.squash}" stroke-width="3"/>`; } });
    return { svg: s + F.svg, head: F.head, s: o.s };
  };

  S.surfer = (o) => {
    const G = figure({ dir: o.dir, grey: true, x: o.x + 78 * o.s, y: o.y, s: o.s * 1.04, flip: true, turn: 0.45, tilt: -2, expr: 'neutral', build: 1.08, noShadow: false,
      arms: { l: [-8, -4], r: [40, 130] } });
    const F = figure({ ...A(o.dir, 2), x: o.x, y: o.y, s: o.s, turn: 0.45, tilt: 10, expr: 'neutral', accent: K.cadet,
      arms: { r: [-6, -2], l: [8, 70] },
      over: (J) => rect(J.hand.l.x + 8, J.hand.l.y - 2, 24, 16, 18, K.cadet) + rect(J.hand.l.x + 8, J.hand.l.y - 2, 17, 10, 18, K.bg, 'fill-opacity="0.25"') });
    return { svg: G.svg + F.svg, head: F.head, s: o.s };
  };

  S.captain = (o) => {
    let s = '';
    [[-62, -14, 0.62, 0.25], [64, -18, 0.6, -0.3], [-30, -24, 0.52, 0.1], [36, -26, 0.5, -0.1]].forEach(([dx, dy, k, t], i) => {
      s += figure({ dir: o.dir, grey: true, x: o.x + dx * o.s, y: o.y + dy * o.s, s: o.s * k, turn: Math.abs(t), flip: t < 0, expr: 'neutral', build: [1.05, 0.95, 1, 1.1][i], noShadow: true, ol: o.bgc || K.oil }).svg;
    });

    s += `<g transform="translate(${o.x - 60 * k} ${o.y})"><path d="M0 0V${f(-176 * k)}M-5 0h10M-5 ${f(-176 * k)}h10" stroke="${K.gravel}" stroke-width="1"/></g>`;

const FOOT = '<div class="foot">CRITICAL SYSTEMS. INTELLIGENT OUTCOMES.</div>';
const art = (name, o) => AdvArt.svg(name, Object.assign({dir:"A", rough:true}, o||{}));
const btn = (label, icon, onclick, cls) => `<button class="btn ${cls||""}" onclick="${onclick}"><span>${label}</span><span>${icon}</span></button>`;
function render(html){ app.innerHTML = html; window.scrollTo(0,0); }
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function split(why){ const i = why.indexOf(" That's you."); return [why.slice(0,i), why.slice(i+1)]; }

/* ============================================================
   SCREENS
   ============================================================ */
function landing(){
  S = fresh();
  render(`<div class="screen">
    ${LOGO}
    <div class="mono" style="font-size:14px;letter-spacing:.08em;margin-top:64px">${EVENT ? "CAREERS // "+esc(EVENT.toUpperCase()) : "CAREERS"}</div>
    <h1 class="h1" style="font-size:48px;line-height:.92;margin:20px 0 0">Are you an Adventurer?</h1>
    <div style="font-size:18px;line-height:1.4;margin-top:24px"><span style="font-weight:700">The systems humanity depends on need intelligent minds willing to go the distance.</span> <span style="color:var(--soft)">So what kind of Adventurer would you be at Sand?</span></div>
    <div style="flex:1;min-height:170px;display:flex;align-items:flex-end;margin:0 -24px"><div style="width:100%;height:150px;padding:0 12px">${art("lineup")}</div></div>
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px">
      ${btn("FIND_OUT","→","intro(0)")}
      <div class="mono" style="font-size:12px;letter-spacing:.04em;color:var(--mute)">7 questions · 90 seconds · merch at the booth</div>
    </div>
  </div>`);
}

function intro(i){
  const c = INTRO[i];
  const next = i < INTRO.length-1 ? `intro(${i+1})` : "startQuiz()";
  render(`<div class="screen">
    <div class="row">${LOGO}<div class="step">${c.step} / 03</div></div>
    <div style="display:flex;flex-direction:column;gap:20px;margin-top:${c.top}">
      <div class="lbl">${c.label}</div>
      <div style="font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:.98;text-wrap:balance">${esc(c.title)}</div>
      ${c.body.map(b=>`<div style="font-size:17px;line-height:1.5;color:var(--mute);text-wrap:pretty">${esc(b)}</div>`).join("")}
      ${c.kicker?`<div style="font-size:19px;font-weight:700;line-height:1.3;border-top:1px solid var(--gravel);padding-top:16px;text-wrap:pretty">${esc(c.kicker)}</div>`:""}
    </div>
    <div style="flex:1;min-height:24px"></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${btn(c.cta,"→",next)}
      ${c.alt?btn("SEE_THE_13_PRINCIPLES_FIRST","","principles()","ghost"):""}
    </div>
    <div style="margin-top:20px">${FOOT}</div>
  </div>`);
}

function principles(){
  render(`<div class="screen fixed">
    <div class="scroll">
      <div class="row">${LOGO}<button class="txt" onclick="intro(2)">← BACK</button></div>
      <div class="lbl" style="margin-top:24px">13 // LEADERSHIP_PRINCIPLES</div>
      <div style="font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:.98;margin-top:16px">Not values. Ways of being.</div>
      <div style="font-size:17px;line-height:1.5;color:var(--mute);margin-top:14px">The thinking tools we use when there isn't a perfect answer.</div>
      <div style="margin-top:24px">
        ${PRINCIPLES.map(([n,t,d])=>`<div style="display:grid;grid-template-columns:36px 1fr;gap:8px;border-top:1px solid var(--oil);padding:14px 0">
          <div class="mono" style="font-size:13px;color:var(--squash);padding-top:2px">${n}</div>
          <div style="display:flex;flex-direction:column;gap:3px"><div style="font-size:18px;font-weight:700;letter-spacing:-.01em">${esc(t)}</div><div style="font-size:15px;line-height:1.4;color:var(--mute)">${esc(d)}</div></div>
        </div>`).join("")}
      </div>
    </div>
    <div class="bar" style="grid-template-columns:auto 1fr">
      <button class="btn ghost" style="width:112px;gap:12px" onclick="intro(2)"><span>←</span><span>BACK</span></button>
      ${btn("TAKE_THE_QUIZ","→","startQuiz()")}
    </div>
  </div>`);
}

// After the result: browse all five Adventurers.
function meet(i){
  const t = ORDER[i], T = TYPES[t], mine = t===S.result, [a,b] = split(T.why);
  render(`<div class="screen fixed">
    <div class="scroll">
      <div class="row">${LOGO}<button class="txt" onclick="result()">← MY RESULT</button></div>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px">
        ${ORDER.map((k,n)=>{ const on = n===i, me = k===S.result; return `<button class="tab" onclick="meet(${n})">
          <div class="av" style="border-color:${on?TYPES[k].accent:"transparent"}">${art(ART[k],{crop:"bust",align:"xMidYMid",bgc:"#202020"})}</div>
          <div class="mono" style="font-size:10px;letter-spacing:.06em;color:${on?"var(--text)":"var(--mute)"}">${me?"YOU":"0"+(n+1)}</div></button>`; }).join("")}
      </div>

function qHead(n, label){

}

}

function question(i){
  const D = QUESTIONS[i];
  const opts = shuffle(D.a);
  S.lock = false;
  render(`<div class="screen">

    <div style="flex:1;min-height:16px"></div>
    <div class="foot" id="qfoot">CRITICAL SYSTEMS. INTELLIGENT OUTCOMES.</div>
  </div>
  <div class="sheetwrap" id="sheetwrap"></div>`);
}

function answer(i, idx){
  if(S.lock) return; S.lock = true;
  const o = QUESTIONS[i].a[idx];
  S.scores[o.t] += 1;
  S.picked.push(o.p);
  document.querySelectorAll(".aw").forEach(w=>{ if(w.id!=="aw"+idx) w.classList.add("gone"); });
  $("c"+idx).classList.add("sel");
  $("qfoot").style.visibility = "hidden";
  const next = i < QUESTIONS.length-1 ? `question(${i+1})` : "tiebreak()";
  $("sheetwrap").innerHTML = `<div class="sheet" id="sheet">
    <div style="display:flex;align-items:baseline;gap:14px"><div class="mono" style="font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--coral)">${PNUM[o.p]}</div><div class="mono" style="font-size:11px;letter-spacing:.1em;color:var(--gravel)">/ 13</div></div>
    <div style="font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1">${esc(o.p)}</div>
    <div style="font-size:17px;line-height:1.45;color:var(--oil);text-wrap:pretty">${esc(o.r)}</div>
    <div class="mono" style="font-size:11px;letter-spacing:.08em;color:var(--gravel);border-top:1px solid #C8C8C8;padding-top:12px">ONE OF OUR 13 LEADERSHIP PRINCIPLES</div>
    ${btn("NEXT","→",next,"dark")}
  </div>`;
  setTimeout(()=>{ const s=$("sheet"); if(s) s.classList.add("in"); }, 260);
}

function tiebreak(){
  const opts = shuffle(ORDER);
  S.lock = false;
  render(`<div class="screen">
    ${qHead(6,"ONE MORE")}
    <div style="font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin-top:24px">Which line is most you?</div>
    <div style="margin-top:24px">${opts.map((t,k)=>ans(t,k,`pickTie('${t}')`,"",TYPES[t].tie)).join("")}</div>
  </div>`);
}
function pickTie(t){
  if(S.lock) return; S.lock = true;
  S.tie = t; $("c"+t).classList.add("sel");
  setTimeout(buildFor, 320);
}

function buildFor(){
  S.lock = false;
  render(`<div class="screen">
    ${qHead(7,"LAST ONE · ABOUT THEM, NOT YOU")}
    <div style="font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin-top:24px">Who do you most want to build for?</div>
    <div style="font-size:16px;line-height:1.45;color:var(--mute);margin-top:10px">Everything we make ends up in one of three sets of hands.</div>
    <div style="margin-top:24px">${BUILD_FOR.map((b,k)=>ans(b.k,k,`pickBuild('${b.k}')`,b.n,b.d,true)).join("")}</div>
  </div>`);
}
function pickBuild(k){
  if(S.lock) return; S.lock = true;
  S.build = k; $("c"+k).classList.add("sel");
  compute();
  setTimeout(unlock, 320);
}

function compute(){
  const sc = Object.assign({}, S.scores);
  if(S.tie) sc[S.tie] += 0.5;
  const max = Math.max(...Object.values(sc));
  const tied = ORDER.filter(t=>sc[t]===max);
  S.result = tied[Math.floor(Math.random()*tied.length)];
  // top principle: most-picked principle within the winning type
  const counts = {};
  S.picked.forEach(p=>counts[p]=(counts[p]||0)+1);
  const mine = TYPES[S.result].principles.filter(p=>counts[p]);
  mine.sort((a,b)=>counts[b]-counts[a]);
  S.top = mine[0] || TYPES[S.result].principles[0];
}

function wrap(ctx, text, x, y, maxW, lh){
  const words=text.split(" "); let line="";

}

}
async function share(){
  const blob = await drawCard();
  const file = new File([blob], "sand-adventurer.png", {type:"image/png"});
  const text = postText();
  mark("shared");
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sand-adventurer.png"; a.click();
  toast("CARD_SAVED · post it with "+TAGS.trim());
}

/* ============================================================
   SUBMISSION — Google Form behind the scenes, with offline queue
   ============================================================ */
const QKEY = "sand_afrotech_queue", LOG = "sand_afrotech_log";
function mark(k){ try{ const l=JSON.parse(localStorage.getItem(LOG)||"{}"); l[k]=(l[k]||0)+1; localStorage.setItem(LOG,JSON.stringify(l)); }catch(e){} }
function queueSubmission(row){
  try{ const q=JSON.parse(localStorage.getItem(QKEY)||"[]"); q.push(row); localStorage.setItem(QKEY,JSON.stringify(q)); }catch(e){}
  flush();
}
async function flush(){
  if(!CONFIG.FORM_ACTION) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){}
  if(!q.length) return;
  const remaining=[];
  for(const row of q){
    const fd = new URLSearchParams();
    for(const [k,id] of Object.entries(CONFIG.ENTRIES)){ if(id && row[k]!==undefined) fd.append(id, row[k]); }
    try{ await fetch(CONFIG.FORM_ACTION,{method:"POST",mode:"no-cors",body:fd}); }
    catch(e){ remaining.push(row); }
  }
  localStorage.setItem(QKEY, JSON.stringify(remaining));
}
window.addEventListener("online", flush);

/* ============================================================
   BOOT
   ============================================================ */
if(Q.get("tally")==="1"){
  // tiny staff view: what this phone has seen
  let l={}; try{ l=JSON.parse(localStorage.getItem(LOG)||"{}"); }catch(e){}
  let q=[]; try{ q=JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){}
  render(`<div class="screen">
    ${LOGO}
    <div class="lbl" style="margin-top:48px">STAFF_VIEW // THIS PHONE ONLY</div>
    <div class="h1" style="font-size:44px;line-height:.95;margin-top:16px">Local tally.</div>
    <div style="font-size:17px;line-height:1.6;margin-top:20px">Queued, unsent: <b>${q.length}</b><br><span style="color:var(--mute)">Shares: ${l.shared||0} · Job clicks: ${l.job||0} · Follows: ${l.follow||0}</span></div>
    <div style="flex:1;min-height:24px"></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${btn("RETRY_SENDING","→","flush().then(()=>location.reload())")}
      ${btn("BACK_TO_QUIZ","→","location.href=location.pathname","ghost")}
    </div>
  </div>`);
} else {
  flush();
  landing();
}
