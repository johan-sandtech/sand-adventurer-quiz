<style>
/* ============================================================
   SAND · Adventurer quiz (any event)
   Silicon design system: dark-first, square buttons, mono labels
   ============================================================ */
@font-face{font-family:"Lilex";src:url("assets/fonts/Lilex-VariableFont_wght.ttf") format("truetype");font-weight:100 900;font-display:swap}
:root{
  --bg:#0A0A0A; --oil:#202020; --gravel:#4D4D4D; --text:#EEEEEE; --mute:#9A9A9A; --soft:#BDBDBD;
  --coral:#F54343; --squash:#F1AE0A; --cadet:#80A2B4;
  --mono:"Lilex",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:"Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:#050505}
body{margin:0;background:#050505;color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
a{color:inherit}
input,select,textarea{font:inherit;color:#fff;border-radius:2px}
input::placeholder,textarea::placeholder{color:#6E6E6E}
select option{background:#202020;color:#fff}
#app{width:100%;max-width:480px;margin:0 auto;background:var(--bg);min-height:100dvh;position:relative}
@media(min-width:520px){#app{border-left:1px solid var(--oil);border-right:1px solid var(--oil)}}
.screen{min-height:100dvh;display:flex;flex-direction:column;padding:24px;background:var(--bg);animation:fade .22s ease-out}
.screen.fixed{height:100dvh;min-height:0;padding:0;overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}
.bar{padding:16px 24px 24px;border-top:1px solid var(--oil);display:grid;gap:8px;background:var(--bg)}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.logo{height:14px;width:auto;align-self:flex-start;display:block;mix-blend-mode:lighten}
.row{display:flex;justify-content:space-between;align-items:center}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:13px;letter-spacing:.12em;color:var(--squash)}
.step{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--mute)}
.foot{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--mute)}
.h1{font-weight:800;letter-spacing:-.035em;text-transform:uppercase}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;height:56px;padding:0 20px;border:1px solid var(--text);border-radius:0;background:var(--text);color:var(--bg);font:600 14px var(--mono);letter-spacing:.06em;white-space:nowrap;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--mute)}
.btn.dark{background:var(--bg);color:var(--text);border-color:var(--bg)}
.btn.rev{flex-direction:row-reverse}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5}
.txt{background:none;color:var(--text);font:400 12px var(--mono);letter-spacing:.08em;min-height:44px;display:flex;align-items:center}
.prog{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:28px}
.prog i{height:3px;background:var(--gravel)}
.prog i.on{background:var(--text)}
.aw{max-height:240px;margin-bottom:10px;overflow:hidden;transition:max-height 280ms cubic-bezier(.4,0,.2,1),opacity 200ms,margin 280ms}
.aw.gone{max-height:0;opacity:0;margin-bottom:0}
.ac{width:100%;min-height:56px;background:var(--oil);border:1px solid var(--oil);border-radius:2px;padding:14px 16px;display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;transition:border-color 120ms}
.ac:active{background:#2A2A2A;border-color:var(--gravel)}
.ac .num{width:28px;height:22px;border:1px solid var(--gravel);color:var(--mute);font:400 11px var(--mono);display:flex;align-items:center;justify-content:center;margin-top:1px}
.ac.sel{border-color:var(--cadet)}
.ac.sel .num{border-color:var(--cadet);background:var(--cadet);color:var(--bg)}
.at{font-size:18px;font-weight:700;letter-spacing:-.015em;line-height:1.2;color:var(--text)}
.atx{font-size:16px;line-height:1.4;color:var(--text)}
.atx.mute{color:var(--mute)}
.sheetwrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:5}
.sheet{width:100%;max-width:480px;background:var(--text);color:var(--bg);padding:24px;display:flex;flex-direction:column;gap:14px;transform:translateY(105%);transition:transform 320ms cubic-bezier(.4,0,.2,1);pointer-events:auto}
.sheet.in{transform:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--mute)}
.inp{height:48px;width:100%;background:var(--oil);border:1px solid var(--gravel);padding:0 14px;font:400 17px var(--sans);outline:none}
.inp:focus{border-color:var(--cadet)}
.inp.bad{border-color:var(--coral)}
textarea.inp{height:auto;padding:12px 14px;line-height:1.4;resize:none}
.selwrap{position:relative}
.selwrap select{appearance:none;-webkit-appearance:none;padding-right:36px}
.selwrap b{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:400 14px var(--mono);color:var(--mute);pointer-events:none}
.chk{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;min-height:48px;padding-top:4px}
.chk .box{width:24px;height:24px;border:1px solid var(--mute);display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:15px;font-weight:700}
.chk.on .box{border-color:var(--cadet);background:var(--cadet)}
.err{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--coral);margin-top:12px;display:none}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:7px 9px;white-space:nowrap;border:1px solid var(--gravel);color:var(--text);border-radius:2px}
.pill.top{border-color:var(--coral);background:var(--coral);color:var(--bg)}
.dh{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--squash)}
.jrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:72px;border-top:1px solid var(--gravel);padding:12px 0;text-decoration:none}
.tile{background:var(--oil);height:104px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;border-radius:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:6px}
.tab .av{width:52px;height:52px;border-radius:50%;background:var(--oil);overflow:hidden;border:2px solid transparent}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--oil);color:var(--text);padding:12px 16px;font:400 12px var(--mono);letter-spacing:.04em;opacity:0;transition:opacity .2s;pointer-events:none;border:1px solid var(--gravel);z-index:9;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>

const Q = new URLSearchParams(location.search);
const SOURCE = Q.get("src") || "conference";

const TAG    = (Q.get("tag") || "").replace(/^#/,"");
const TAGS   = (TAG ? "#"+TAG+" " : "") + "#BuildWhatMatters";
const GH = "https://job-boards.eu.greenhouse.io/sandtechholdingslimited/jobs/";
const JOBS = {
  fde:{t:"Forward Deployed Engineer", l:"USA", id:"4976227101"},
  se: {t:"Software Engineer", l:"USA · Baltimore on-site", id:"4956160101"},
  tl: {t:"Technical Lead", l:"USA", id:"4989546101"},

const job = k => JOBS[k].id ? GH + JOBS[k].id + "?gh_src=" + CONFIG.GH_SRC : CONFIG.CAREERS;

/* ============================================================
   CONTENT
   ============================================================ */
const TYPES = {
  gonzo:{ name:"The Gonzo", cluster:"Action, Ownership & Execution", accent:"#F54343", bg:"#0A0A0A",
    line:"You don't cover the story. You go and live it.",
    why:"Hunter S. Thompson didn't cover the story from the press box. He rode with the Hells Angels and wrote it from inside. That's you. You don't wait for the brief, the permission or the perfect plan. You go in, get your hands dirty, and come back with the thing nobody else could have written.",
    hero:["Hunter S. Thompson didn't cover the story from the press box. He rode with the Hells Angels and wrote it from inside. You don't wait for the brief, the permission or the perfect plan.","You go in, get your hands dirty, and come back with the thing nobody else could have written."],
    principles:["Decide","Get Stuff Done","Do Hard Things"],
    says:"You're the one on the plane before anyone's asked. Ambiguity doesn't scare you, it wakes you up, and you'd rather meet the system you're building for than guess at it from a desk.",
    proof:"A city's operations centre stood up in days, not months. Someone had to be on that plane.",
    watch:"Going in so hard you forget to report back. The Gonzo's job is to come out with the story, not just the scars.",
    tie:"Anything that gets your blood racing is probably worth doing.",
    post:"Turns out I'm a Gonzo. Took the Sand Technologies Adventurer quiz{where} and apparently I don't cover the story, I go and live it. {tags}",
    jobs:["fde","se"] },
  mech:{ name:"The Mechanic", cluster:"Operational Excellence & Simplicity", accent:"#F1AE0A", bg:"#0A0A0A",
    line:"Find the part that's actually broken. Fix that. Properly.",
    why:"A good mechanic doesn't read you the brochure. She listens to the engine, finds the one part that's actually wrong, and fixes that. Properly. No extra bolts. That's you. Complicated problems, simple fixes, done right, and you won't hand the keys back until it runs.",
    hero:["A good mechanic doesn't read you the brochure. She listens to the engine and finds the one part that's actually wrong. You'd rather fix that properly than add extra bolts.","Complicated problems, simple fixes, done right."],
    principles:["K.I.S.S","Raise The Bar"],
    says:"You refuse to let the solution be as complicated as the problem. A broken thing is an invitation, and “works in the demo” is not the bar. You want your work running in a live system someone depends on, not in a report nobody reads.",
    proof:"Planning hundreds of telecom networks from data that was never meant to be planned from.",
    watch:"Loving the engine more than the drive. The fix only counts when the person who runs the system uses it.",
    tie:"I'm weirdly attracted to maintaining impeccable infrastructure.",
    post:"Turns out I'm a Mechanic. Took the Sand Technologies Adventurer quiz{where} and apparently I find the part that's actually broken and fix that, properly. {tags}",
    jobs:["se","de"] },
  surf:{ name:"The Surfer", cluster:"Clients, Integrity & the Long Game", accent:"#80A2B4", bg:"#0A0A0A",
    line:"Read the water. The ocean's in charge, and you're fine with that.",
    why:"Surfers will drive for hours on a rumour of a good wave. Then they'll sit in the water and wait. They read it, they respect it, and they know the ocean's in charge, not them. That's you. You take the client's world as it is, you tell them the truth about the conditions, and you're still there next season. Laid back on the surface. Relentless underneath.",
    note:"Surf like Yvon is Yvon Chouinard, the Patagonia founder: do the right thing, play the long game, go surfing when the waves are good.",
    hero:["Surfers will drive for hours on a rumour of a good wave, then sit in the water and wait. You read the conditions, you tell the truth about them, and you're still there next season.","Laid back on the surface. Relentless underneath."],
    principles:["Our Clients Run the Company","Surf like Yvon","Play The Long Game"],
    says:"You're the one the operator calls. You'd rather say the hard thing today than the comfortable thing in six months, and you measure success by whether the system's still in use a year on, by people who'd fight to keep it.",
    proof:"Helping run a capital city's water supply for years. Not launching it and leaving.",
    watch:"Saying yes too often. Respecting the ocean sometimes means telling people the surf's closed.",
    tie:"No matter the state of the tide, I will find a wave to ride.",
    post:"Turns out I'm a Surfer. Took the Sand Technologies Adventurer quiz{where} and apparently I read the water and the ocean's in charge. {tags}",
    jobs:["fde","pd"] },
  capt:{ name:"The Captain", cluster:"Collaboration & Inclusion", accent:"#EEEEEE", bg:"#202020",
    line:"Know every role. Get everyone home.",
    why:"A captain's job isn't to be the best sailor on the boat. It's to know every role, make sure every voice gets heard when it matters, and get everyone home. That's you. You own the outcome, you grow the crew, and you're quietly training the next captain the whole time.",
    hero:["A captain's job isn't to be the best sailor on the boat. It's to know every role and make sure every voice gets heard when it matters. You own the outcome and you grow the crew.","You're quietly training the next captain the whole time."],
    principles:["Each One, Teach Ten","Everybody Is Welcome"],
    says:"You own the outcome, not just your part of it. You notice who isn't being heard, you teach rather than carry, and you'd rather ten people could do the thing than be the only one who can.",
    proof:"Training a ministry's own data team so the system keeps working long after we've gone.",
    watch:"Carrying the crew instead of growing it. Everyone leads means everyone, including the people you're tempted to carry.",
    tie:"The ship has weather'd every rack, the prize we sought is won.",
    post:"Turns out I'm a Captain. Took the Sand Technologies Adventurer quiz{where} and apparently I know every role and get everyone home. {tags}",
    jobs:["tl","pd"] },
  pack:{ name:"The Backpacker", cluster:"Growth, Innovation & Resilience", accent:"#F1AE0A", bg:"#0A0A0A",
    line:"Take the road nobody recommended. Come back with the story.",
    why:"Backpackers pack light, take the road nobody recommended, and get lost on purpose. The wrong turn is the story. They come home different. That's you. New country, new system, new domain, no map: good. You'll learn it, you'll get some of it wrong, and you'll write the guide for whoever comes next.",
    hero:["Backpackers pack light, take the road nobody recommended, and get lost on purpose. The wrong turn is the story. New system, new domain, no map: good.","You'll learn it, get some of it wrong, and write the guide for whoever comes next."],
    principles:["Choose Growth","Pioneer","There Is No Failure"],
    says:"You go back to first principles because the guidebook is usually wrong. A wrong turn is the most useful data you'll get all month, and you'd rather be somewhere nobody's mapped than somewhere comfortable.",
    proof:"Taking the same approach from water pipes to a racing team's pit wall, and finding out what carries over.",
    watch:"Leaving before you've unpacked. The best Backpackers leave something behind that still works after they've gone.",
    tie:"Carry as little as possible, but choose that little with care.",
    post:"Turns out I'm a Backpacker. Took the Sand Technologies Adventurer quiz{where} and apparently I take the road nobody recommended and come back with the story. {tags}",
    jobs:["de","fde"] }
};
const ORDER = ["gonzo","mech","surf","capt","pack"];

const PRINCIPLES = [
  ["01","Choose Growth","Stay curious; keep learning and improving."],
  ["02","Decide","Take initiative. Don't wait for permission."],
  ["03","Get Stuff Done","Execution over perfection; move fast, adapt."],
  ["04","K.I.S.S","Cut process. Simplicity and common sense."],
  ["05","Surf like Yvon","Integrity and transparency over short-term wins."],
  ["06","Our Clients Run the Company","Serve clients obsessively; delight them."],
  ["07","Play The Long Game","Build lasting relationships on trust and care."],
  ["08","Do Hard Things","Tackle meaningful problems. Push boundaries."],
  ["09","Everybody Is Welcome","Inclusive teams; respect every dimension of diversity."],
  ["10","Each One, Teach Ten","Mentor and share knowledge generously."],
  ["11","Raise The Bar","Exceptional work; set new standards."],
  ["12","There Is No Failure","Setbacks are learning. Aim high, take risks."],
  ["13","Pioneer","Be bold. Experiment at the cutting edge."]
];
const PNUM = {"Choose Growth": "01", "Decide": "02", "Get Stuff Done": "03", "K.I.S.S": "04", "Surf like Yvon": "05", "Our Clients Run the Company": "06", "Play The Long Game": "07", "Do Hard Things": "08", "Everybody Is Welcome": "09", "Each One, Teach Ten": "10", "Raise The Bar": "11", "There Is No Failure": "12", "Pioneer": "13"};
const QUESTIONS = [
  { q:"You're asked to build something in the field for a client. There's no manual and very little precedent. What's your first move?", a:[
    {t:"surf", p:"Play The Long Game", a:"I ask the operator what they'd want in five years, not what will demo well in five weeks. I want them to understand our priorities.", r:"We build for the person who'll still be running it in five years, not for the demo."},
    {t:"capt", p:"Each One, Teach Ten", a:"I find the two people who've done the nearest thing to it and we work it out together. I learn from them, they learn from me.", r:"Nobody here solves hard things alone, and nobody keeps what they learned to themselves."},
    {t:"pack", p:"Pioneer", a:"I start my research to write that manual. It would benefit everyone now, and we can iterate it for years to come.", r:"Most of what we build has no precedent. That's the job, not a bug."} ]},
  { q:"You've just been posted to a city you've never been to, with a team you've never met. What do you do first?", a:[
    {t:"gonzo", p:"Get Stuff Done", a:"Land, find the plant, start. The plan writes itself once you're in the room.", r:"You'll be in a plant in week one, not a planning deck. The field is the office."},
    {t:"capt", p:"Everybody Is Welcome", a:"I listen, I ask questions, I learn what everyone's good at. I make sure the quietest person gets heard.", r:"Our teams span four continents and every kind of difference. That's a feature."},
    {t:"pack", p:"Choose Growth", a:"New city, new system, new domain? Start learning it all from scratch.", r:"One career, dozens of contexts. Nobody here has done the next thing before either."} ]},
  { q:"The data model you built is live in a water utility's control room. At 2 a.m. it flags something nobody expected could happen – crisis! What do you do?", a:[
    {t:"gonzo", p:"Do Hard Things", a:"I'm on the next flight. You don't fix a control room from a hotel.", r:"Our systems run water, power and cities. There's no “just staging”, and it isn't always office hours."},
    {t:"mech", p:"K.I.S.S", a:"Before anyone panics: sensor, pipeline or model? Figure out what you can first.", r:"Complex problems, simple solutions. Cut the process, find the cause."},
    {t:"pack", p:"There Is No Failure", a:"Interesting. If the model's wrong, that's the most useful thing it's told us all month. Time for some damage control…", r:"Some bets will be wrong. What matters is how fast you learn from them."} ]},
  { q:"The demo worked and the client's delighted. But after the fact, you've spotted a corner case that'll cause problems six months from now… What do you do?", a:[
    {t:"gonzo", p:"Decide", a:"I will fix it tonight and tell them in the morning. Nobody needs to approve that.", r:"Nobody here waits for permission to do the right thing."},
    {t:"mech", p:"Raise The Bar", a:"It doesn't ship until it's fixed. “Works in the demo” isn't the bar.", r:"Good enough isn't. Exceptional work, new standards."},
    {t:"surf", p:"Surf like Yvon", a:"I'll tell them today. A delighted client who doesn't know what is happening is a problem waiting to happen.", r:"Integrity over the short-term win, every time. Named for Yvon Chouinard, the Patagonia founder."} ]},
  { q:"A teammate's stuck on something, but you can see the solution. What do you do?", a:[
    {t:"mech", p:"K.I.S.S", a:"Ask them to show me the error. Nine times out of ten the fix is simpler than the problem looks.", r:"The simplest fix that works beats the clever one that doesn’t work without even more work.."},
    {t:"surf", p:"Our Clients Run the Company", a:"Who's waiting on it? If it's the operator, we fix it now and tidy up after.", r:"The operator waiting on it is the boss."},
    {t:"capt", p:"Each One, Teach Ten", a:"I sit with them until it's unstuck, then we make sure nobody on the team hits it again.", r:"Fixing it once is good. Making sure nobody hits it again is Sand."} ]}
];

const BUILD_FOR = [
  {k:"operators", n:"The people on the night shift", d:"The grid controller, the water plant operator, the clinic's case worker. They act on what the system tells them, right now."},
  {k:"builders", n:"The people who build the tools", d:"The data engineers, the modellers, the product teams who make the system smarter."},
  {k:"planners", n:"The people who decide where the money goes", d:"The programme directors and policy leaders planning years ahead."}
];

const FIT = {
  gonzo:{ operators:["Embedded engineer with a client. You're the one in the control room at 2 a.m.","fde"],
          builders:["Embedded engineer who turns what the field needs into tools the next team can reuse.","fde"],
          planners:["Change lead or embedded engineer: landing a new way of working with a city's leadership.","pd"] },
  mech: { operators:["Keeping what we shipped running where it runs: the engineer the night shift relies on.","se"],
          builders:["Software or data engineer: the pipelines and services behind every number on the screen.","se"],
          planners:["Data scientist: the models a programme director will actually bet a budget on.","de"] },
  surf: { operators:["Embedded engineer, the adoption half: you're the reason the night shift trusts the screen.","fde"],
          builders:["Product: the one who says no to features nobody asked for and yes to the ones operators did.","fde"],
          planners:["Change lead: landing a new way of working with a city's leadership and staying until it sticks.","pd"] },
  capt: { operators:["Technical lead on a deployment: own the outcome and grow the team around it.","fde"],
          builders:["Technical lead or product lead: ship what the builders need and teach ten as you go.","se"],
          planners:["Change lead or product director: adoption, trust, handing the keys over properly.","pd"] },
  pack: { operators:["Embedded engineer or researcher: the first deployment in a new domain, written up for the next.","fde"],
          builders:["Platform engineer or researcher: the capabilities that don't exist yet.","se"],
          planners:["Researcher or data scientist: the models that let planners see years ahead.","de"] }
};

const ROLES = ["Engineering","Data science & ML","Product & design","Delivery & client work","Not sure yet"];

const INTRO = [
  { step:"01", top:"96px", label:"01 // WHAT_WE_DO", title:"We make critical systems intelligent.",
    body:["Water, power, health, connectivity, cities. Our platform works out what's going on and tells the people running it what to do next."], cta:"NEXT" },
  { step:"02", top:"96px", label:"02 // HOW_WE_DO_IT", title:"We embed with our clients to make it stick.",

  { step:"03", top:"48px", label:"03 // HOW_THIS_WORKS", title:"It takes a certain kind of person.",

];

/* ============================================================

function answer(i, idx){
  if(S.lock) return; S.lock = true;
  const o = QUESTIONS[i].a[idx];
  S.scores[o.t] += 1;
  S.picked.push(o.p);
  document.querySelectorAll(".aw").forEach(w=>{ if(w.id!=="aw"+idx) w.classList.add("gone"); });
  $("c"+idx).classList.add("sel");
  $("qfoot").style.visibility = "hidden"; $("qart").style.visibility = "hidden";
  const next = i < QUESTIONS.length-1 ? `question(${i+1})` : "tiebreak()";
  $("sheetwrap").innerHTML = `<div class="sheet" id="sheet">
    <div style="display:flex;align-items:baseline;gap:14px"><div class="mono" style="font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1;color:var(--coral)">${PNUM[o.p]}</div><div class="mono" style="font-size:11px;letter-spacing:.1em;color:var(--gravel)">/ 13</div></div>

}

function tiebreak(){
  const opts = shuffle(ORDER);
  S.lock = false;
  render(`<div class="screen">
    ${qHead(6,"ONE MORE")}
    <div style="font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin-top:24px">Which line is most you?</div>
    <div style="margin-top:24px">${opts.map((t,k)=>ans(t,k,`pickTie('${t}')`,"",TYPES[t].tie)).join("")}</div>
  </div>`);
}
function pickTie(t){
  if(S.lock) return; S.lock = true;
  S.tie = t; $("c"+t).classList.add("sel");
  setTimeout(buildFor, 320);
}

function buildFor(){
  S.lock = false;
  render(`<div class="screen">
    ${qHead(7,"LAST ONE · ABOUT THEM, NOT YOU")}
    <div style="font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.08;margin-top:24px">Who do you most want to build for?</div>
    <div style="font-size:16px;line-height:1.45;color:var(--mute);margin-top:10px">Everything we make ends up in one of three sets of hands.</div>
    <div style="margin-top:24px">${BUILD_FOR.map((b,k)=>ans(b.k,k,`pickBuild('${b.k}')`,b.n,b.d,true)).join("")}</div>
  </div>`);
}
function pickBuild(k){
  if(S.lock) return; S.lock = true;
  S.build = k; $("c"+k).classList.add("sel");
  compute();
  setTimeout(unlock, 320);
}

function compute(){
  const sc = Object.assign({}, S.scores);
  if(S.tie) sc[S.tie] += 0.5;
  const max = Math.max(...Object.values(sc));
  const tied = ORDER.filter(t=>sc[t]===max);
  S.result = tied[Math.floor(Math.random()*tied.length)];
  // top principle: most-picked principle within the winning type
  const counts = {};
  S.picked.forEach(p=>counts[p]=(counts[p]||0)+1);
  const mine = TYPES[S.result].principles.filter(p=>counts[p]);
  mine.sort((a,b)=>counts[b]-counts[a]);
  S.top = mine[0] || TYPES[S.result].principles[0];
}

function toggleConsent(){

function submitForm(e){
  e.preventDefault();

  $("err").style.display = ok ? "none" : "block";

  S.form = { name:$("name").value.trim(), email, city:$("city").value.trim(), role:$("role").value, link:$("link").value.trim(), problem:$("problem").value.trim(), consent:"yes" };
  queueSubmission(buildRow());
  result();
  return false;
}

  const T = TYPES[S.result];

    <div style="flex:1;min-height:24px"></div>
    <div class="row" style="gap:12px">
      <div class="foot" style="letter-spacing:.1em">CRITICAL SYSTEMS. INTELLIGENT OUTCOMES.</div>
      <button class="mono" style="font-size:10px;letter-spacing:.12em;min-height:48px;display:flex;align-items:center" onclick="${S.result?"result()":"landing()"}">${S.result?"BACK":"RESTART"}</button>
    </div>
  </div>`);
}

/* ============================================================
   SHARE CARD (1080×1080) + LINKEDIN TEXT
   ============================================================ */
function postText(){ return TYPES[S.result].post.replace("{where}", EVENT ? " at "+EVENT : "").replace("{tags}", TAGS.trim()); }
async function copyPost(){
  try{
    await navigator.clipboard.writeText(postText()); mark("shared");
    const l=$("copyLbl"); if(l){ l.textContent="COPIED_TO_CLIPBOARD"; clearTimeout(copyTimer); copyTimer=setTimeout(()=>{ const x=$("copyLbl"); if(x) x.textContent="COPY_A_LINKEDIN_POST"; },2200); }
  }catch(e){ prompt("Copy this:", postText()); }
}
function wrap(ctx, text, x, y, maxW, lh){
  const words=text.split(" "); let line="";
  for(const w of words){ const t=line?line+" "+w:w; if(ctx.measureText(t).width>maxW && line){ ctx.fillText(line,x,y); line=w; y+=lh; } else line=t; }
  if(line) ctx.fillText(line,x,y); return y+lh;
}
const loadImg = src => new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
async function drawCard(){
  const T = TYPES[S.result], n = ORDER.indexOf(S.result)+1;
  const c = $("shareCanvas"), ctx = c.getContext("2d");
  const MONO = "Lilex, ui-monospace, Menlo, monospace", SANS = '"Inter Tight", Inter, sans-serif';
  try{ await Promise.all([document.fonts.load('800 100px "Inter Tight"'), document.fonts.load('500 22px Lilex')]); }catch(e){}
  ctx.fillStyle="#0A0A0A"; ctx.fillRect(0,0,1080,1080);
  ctx.textBaseline="alphabetic";
  try{ const img = await loadImg("assets/sand-logo-white.png"); ctx.globalCompositeOperation="lighten"; ctx.drawImage(img,80,78,200,51.4); ctx.globalCompositeOperation="source-over"; }
  catch(e){ ctx.fillStyle="#EEEEEE"; ctx.font="800 48px "+SANS; ctx.fillText("SAND",80,128); }
  ctx.textAlign="right"; ctx.fillStyle="#9A9A9A"; ctx.font="500 22px "+MONO;
  ctx.fillText(EVENT ? "CAREERS // "+EVENT.toUpperCase() : "CAREERS", 1000, 112); ctx.textAlign="left";
  try{
    const h=340, im = await loadImg("assets/art/"+ARTN[S.result][0]+".svg"), w = Math.round(h*im.naturalWidth/im.naturalHeight);
    ctx.drawImage(im,540-w/2,170,w,h);
  }catch(e){}
  ctx.fillStyle=T.accent; ctx.font="500 22px "+MONO;
  ctx.fillText("ADVENTURER 0"+n+" / 05", 80, 566);
  ctx.fillStyle="#EEEEEE";
  let size=112; const name=T.name.toUpperCase();
  do{ ctx.font="800 "+size+"px "+SANS; size-=4; }while(ctx.measureText(name).width>920 && size>40);
  ctx.fillText(name, 80, 676);
  ctx.fillStyle="#BDBDBD"; ctx.font="500 38px "+SANS;
  let y = wrap(ctx, T.line, 80, 744, 900, 50);
  ctx.fillStyle="#F54343"; ctx.font="500 22px "+MONO;
  wrap(ctx, T.principles.join("  ·  ").toUpperCase(), 80, y+16, 920, 34);
  ctx.strokeStyle="#4D4D4D"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(80,980); ctx.lineTo(1000,980); ctx.stroke();
  ctx.fillStyle="#9A9A9A"; ctx.font="500 20px "+MONO;
  ctx.fillText(TAGS.trim().toUpperCase().replace(" ","   "), 80, 1030);
  ctx.textAlign="right"; ctx.fillText("CRITICAL SYSTEMS. INTELLIGENT OUTCOMES.", 1000, 1030); ctx.textAlign="left";
  return new Promise(res=>c.toBlob(res,"image/png"));
}
async function share(){
  const blob = await drawCard();
  const file = new File([blob], "sand-adventurer.png", {type:"image/png"});
  const text = postText();
  mark("shared");
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], text}); return; }catch(e){ if(e.name==="AbortError") return; }
  }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="sand-adventurer.png"; a.click();
  toast("CARD_SAVED · post it with "+TAGS.trim());
}

/* ============================================================
   SUBMISSION — Google Form behind the scenes, with offline queue
   ============================================================ */
const QKEY = "sand_afrotech_queue", LOG = "sand_afrotech_log";
function mark(k){ try{ const l=JSON.parse(localStorage.getItem(LOG)||"{}"); l[k]=(l[k]||0)+1; localStorage.setItem(LOG,JSON.stringify(l)); }catch(e){} }
function queueSubmission(row){
  try{ const q=JSON.parse(localStorage.getItem(QKEY)||"[]"); q.push(row); localStorage.setItem(QKEY,JSON.stringify(q)); }catch(e){}
  flush();
}
async function flush(){
  if(!CONFIG.FORM_ACTION) return;
  let q=[]; try{ q=JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){}
  if(!q.length) return;
  const remaining=[];
  for(const row of q){
    const fd = new URLSearchParams();
    for(const [k,id] of Object.entries(CONFIG.ENTRIES)){ if(id && row[k]!==undefined) fd.append(id, row[k]); }
    try{ await fetch(CONFIG.FORM_ACTION,{method:"POST",mode:"no-cors",body:fd}); }
    catch(e){ remaining.push(row); }
  }
  localStorage.setItem(QKEY, JSON.stringify(remaining));
}
window.addEventListener("online", flush);

/* ============================================================
   BOOT
   ============================================================ */
if(Q.get("tally")==="1"){
  // tiny staff view: what this phone has seen
  let l={}; try{ l=JSON.parse(localStorage.getItem(LOG)||"{}"); }catch(e){}
  let q=[]; try{ q=JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){}
  render(`<div class="screen">
    ${LOGO}
    <div class="lbl" style="margin-top:48px">STAFF_VIEW // THIS PHONE ONLY</div>
    <div class="h1" style="font-size:44px;line-height:.95;margin-top:16px">Local tally.</div>
    <div style="font-size:17px;line-height:1.6;margin-top:20px">Queued, unsent: <b>${q.length}</b><br><span style="color:var(--mute)">Shares: ${l.shared||0} · Job clicks: ${l.job||0} · Follows: ${l.follow||0}</span></div>
    <div style="flex:1;min-height:24px"></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      ${btn("RETRY_SENDING","→","flush().then(()=>location.reload())")}
      ${btn("BACK_TO_QUIZ","→","location.href=location.pathname","ghost")}
    </div>
  </div>`);
} else {
  flush();
  landing();
}
</script>
</body>
